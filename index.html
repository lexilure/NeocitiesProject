<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Pink Background with Infinite GIF</title>
  <link rel="stylesheet" href="styles.css"> <!-- Link to the external CSS file -->
</head>
<body>
  <div class="center-image">
    
    <img id="bed-image" src="img/bed.png" alt="Bed">
    <img id="wall-image" src="img/wall.png" alt="Wall">
    <img id="girl-gif" src="img/girl.gif" alt="Girl">
    <img id="floor-image" src="img/floor.png" alt="Floor">
    <img id="tv-image" src="img/tv.png" alt="TV">
    <div class="image-container">
      <div class="button-stack left">
        <button id="about-btn" class="btn">About Me</button>
        <button id="donate-btn" class="btn">Donate</button>
      </div>
      <div class="button-stack right">
        <button id="closet-btn" class="btn">Closet</button>
        <button id="sketchbook-btn" class="btn"><a href="works.html" class="btn-link">Sketchbook</a></button>
        <button id="guestbook-btn" class="btn">Guest book</button>
      </div>
    </div>
  </div>
</body>
</html>
